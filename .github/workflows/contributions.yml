name: Refresh contribution map

on:
  schedule:
    # Tuesdays and Thursdays at 05:17 UTC / 06:17 Africa/Lagos.
    - cron: '17 5 * * 2,4'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/contributions.yml'
      - 'scripts/update_contributions.py'

permissions:
  contents: read

concurrency:
  group: contribution-map
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'heyohjayy/heyohjayy'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Render contribution map
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update_contributions.py
      - name: Commit updated map
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/contributions.svg assets/contributions-static.svg site/contributions.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: refresh contribution map'
          git pull --rebase origin main
          git push origin HEAD:main

  deploy:
    needs: refresh
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
